# Weekly Postgres backup (InsForge) + optional Google Drive upload.
# Requires GitHub secret DATABASE_URL. See artifacts/lista/docs/PRODUCTION-MAINTENANCE.md
name: LISTA DB backup

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

concurrency:
  group: lista-db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Require DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add DATABASE_URL to GitHub Actions secrets (see PRODUCTION-MAINTENANCE.md)."
            exit 1
          fi

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          STAMP=$(date -u +%Y%m%d)
          FILE="lista-db-${STAMP}.sql"
          pg_dump "$DATABASE_URL" --no-owner --no-acl -f "$FILE"
          gzip -9 "$FILE"
          echo "BACKUP_FILE=${FILE}.gz" >> "$GITHUB_ENV"
          ls -lh "${FILE}.gz"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lista-db-backup-${{ github.run_number }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          if-no-files-found: error

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Upload to Google Drive (optional)
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: node artifacts/lista/scripts/upload-backup-to-gdrive.mjs "${{ env.BACKUP_FILE }}"
